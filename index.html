<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ điều hành Win999 - Lỗi 20/10</title>
    <style>
        body {
            /* TRẠNG THÁI 1 (LỖI): Nền đen, lưới xanh lá kiểu hacker/hệ thống */
            background-color: #050505; 
            background-image: 
              linear-gradient(rgba(0, 255, 0, 0.15) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0, 255, 0, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            overflow: hidden;
            transition: background-color 0.8s ease, background-image 0.8s ease;
        }

        /* TRẠNG THÁI 2 (VUI TƯƠI): Được đổi khi click */
        body.happy-mode {
            background-color: #dbe9f4; 
            background-image: radial-gradient(#a3c2db 3px, transparent 3px);
            background-size: 30px 30px;
        }

        /* Giao diện cửa sổ retro Win999 */
        .win-window {
            background: #c0c0c0;
            border-top: 3px solid #ffffff;
            border-left: 3px solid #ffffff;
            border-right: 3px solid #000000;
            border-bottom: 3px solid #000000;
            width: 90%;
            max-width: 450px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            z-index: 10;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: box-shadow 0.8s ease;
        }

        body.happy-mode .win-window {
            box-shadow: 10px 10px 0px rgba(0,0,0,0.15);
        }

        @keyframes popUp {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 5px 8px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: #c0c0c0;
            color: black;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            width: 22px;
            height: 22px;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        .content {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            font-size: 50px;
        }

        .message {
            font-size: 16px;
            line-height: 1.6;
            color: #000;
        }

        .btn-container {
            text-align: center;
            padding-bottom: 20px;
        }

        button {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 8px 35px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        button:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        .falling-item {
            position: absolute;
            top: -10vh;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 1;
            opacity: 0.9;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Cửa sổ hệ điều hành -->
    <div class="win-window" id="mainWindow">
        <div class="title-bar">
            <span id="windowTitle">⚠️ C:\WIN999\SYSTEM_ALERT.EXE</span>
            <div class="close-btn" onclick="fakeError()">X</div>
        </div>
        <div class="content">
            <div class="icon" id="windowIcon">⚠️</div>
            <div class="message" id="windowMessage">
                <strong>LỖI HỆ THỐNG NGHIÊM TRỌNG!</strong><br><br>
                Hệ điều hành <i>Win999</i> phát hiện <b> unknown user </b> đang sử dụng thiết bị này.<br><br>
                Yêu cầu nhận ngay lời chúc 20/10 để khôi phục! 
            </div>
        </div>
        <div class="btn-container">
            <button id="actionBtn" onclick="fakeError()">[ Yass ]</button>
        </div>
    </div>

    <script>
        let isActivated = false;

        // Hàm bật chế độ Toàn màn hình
        function goFullScreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) { /* Safari / Chrome cổ */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            const icons = ['🌸', '🌺', '💖', '✨', '💌', '🎉'];
            item.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 3 + 's';
            item.style.fontSize = Math.random() * 15 + 15 + 'px';

            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        function fakeError() {
            // Tự động bật Toàn màn hình ngay khi người dùng tương tác click
            goFullScreen();

            if (isActivated) return;
            isActivated = true;

            document.body.classList.add('happy-mode');

            setTimeout(() => {
                alert("Tiến trình cài đặt đã đạt 100%.\nChúc 20/10 vui vẻ :P");
                
                setInterval(createFallingItem, 150);

                document.getElementById('windowTitle').innerText = "💖 C:\\WIN999\\HAPPINESS.EXE";
                document.getElementById('windowIcon').innerText = "🌸";
                document.getElementById('windowMessage').innerHTML = "<strong>ĐÃ KHÔI PHỤC HỆ THỐNG!<br><br>Chúc mừng 20/10 nha! 🎉";
                
                const btn = document.getElementById('actionBtn');
                btn.innerText = "[ Hoàn tất ]";
                btn.onclick = closeCard;
            }, 300);
        }

        // Hàm xử lý việc đóng tab / đóng ứng dụng
        function closeCard() {
            // Thử tự đóng tab
            window.open('', '_self', '');
            window.close();

            // Nếu trình duyệt chặn không cho đóng tab, hiển thị màn hình tắt nguồn vui vẻ
            setTimeout(() => {
                document.body.className = ''; // Xóa nền sáng
                document.body.style.backgroundColor = '#000000';
                document.body.style.backgroundImage = 'none';
                document.body.innerHTML = `
                    <div style="color: #00ff00; text-align: center; font-family: 'MS Sans Serif', Tahoma, sans-serif; z-index: 100;">
                        <h1 style="font-size: 28px; margin-bottom: 10px;">SYSTEM SHUTDOWN SUCCESSFUL! 🌸</h1>
                        <p style="color: #ffffff; font-size: 16px;">Hệ thống Win999 đã tắt an toàn. Bạn có thể tự đóng tab này nhé! ❤️</p>
                    </div>
                `;
            }, 200);
        }
    </script>

</body>
</html>
